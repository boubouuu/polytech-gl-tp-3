name: Deploy Javadoc to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build Javadoc
        run: mvn -B -q -DskipTests javadoc:javadoc
      - name: Mutation testing (PIT)
        run: mvn -B -q test-compile pitest:mutationCoverage
      - name: Assemble site (Javadoc at root, PIT under /pit)
        run: |
          mkdir -p target/site-pages
          cp -r target/site/apidocs/. target/site-pages/
          mkdir -p target/site-pages/pit
          cp -r target/pit-reports/. target/site-pages/pit/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
