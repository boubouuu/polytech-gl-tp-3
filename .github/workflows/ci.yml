name: CI — Java Maven + SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request_target:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull_request_target checks out the base branch by default; we need
          # the PR's own head commit so we build/analyze the contributor's code.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0  # requis pour SonarCloud (historique)
          # Nécessaire car actions/checkout refuse par défaut de checkout du code
          # d'un fork dans un contexte pull_request_target (risque "pwn request").
          # Accepté ici : dépôt pédagogique, contributeurs identifiés, et les
          # workflows de premiers contributeurs restent soumis à approbation.
          allow-unsafe-pr-checkout: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build & Test
        run: mvn -q -B clean verify
      - name: Build summary
        if: always()
        run: |
          echo "### Résumé du build" >> $GITHUB_STEP_SUMMARY
          echo "- Auteur : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branche : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Statut : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      - name: SonarQube Cloud Scan
        run: |
          if [ "$GH_EVENT_NAME" = "pull_request_target" ]; then
            mvn -q -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.pullrequest.key="$PR_NUMBER" \
              -Dsonar.pullrequest.branch="$PR_HEAD_REF" \
              -Dsonar.pullrequest.base="$PR_BASE_REF"
          else
            mvn -q -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.qualitygate.wait=true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
